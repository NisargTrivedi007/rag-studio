version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragdb
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Beyondthewall007
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    command: serve

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragapi
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=ragdb;Username=postgres;Password=Beyondthewall007"
      Ollama__Endpoint: "http://ollama:11434"
      Ollama__EmbeddingModel: "nomic-embed-text"
      Ollama__ChatModel: "llama3.1"
      Chunking__ChunkSize: "512"
      Chunking__Overlap: "50"
      Chunking__TopK: "5"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ollama_data:
