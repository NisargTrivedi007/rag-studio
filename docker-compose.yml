version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ragapi
    environment:
      ConnectionStrings__Postgres: "Host=host.docker.internal;Port=5432;Database=ragdb;Username=postgres;Password=Beyondthewall007"
      Ollama__Endpoint: "http://host.docker.internal:11434"
      Ollama__EmbeddingModel: "nomic-embed-text"
      Ollama__ChatModel: "llama3.1"
      Chunking__ChunkSize: "512"
      Chunking__Overlap: "50"
      Chunking__TopK: "5"
    ports:
      - "5247:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ragui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:4200"
    environment:
      API_URL: "http://api:8080"
    command: npm start
