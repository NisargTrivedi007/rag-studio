<div class="mx-auto w-full max-w-3xl px-6 pb-6">
  <div
    class="flex flex-col rounded-2xl border border-[var(--color-border)] bg-[var(--color-input)] shadow-sm focus-within:border-[var(--color-primary)]"
  >
    @if (attachedFile()) {
      <div class="flex items-center gap-2 border-b border-[var(--color-border)] px-4 py-2 text-xs">
        <app-icon name="paperclip" [size]="14" />
        <span class="truncate">{{ attachedFile()!.name }}</span>
        <button
          (click)="clearFile()"
          class="ml-auto cursor-pointer text-[var(--color-text-muted)] hover:text-[var(--color-accent)]"
          aria-label="Remove file"
        >
          <app-icon name="x" [size]="14" />
        </button>
      </div>
    }

    <textarea
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
      (keydown.enter)="handleEnter($event)"
      rows="1"
      placeholder="Ask about your documents..."
      class="max-h-40 w-full resize-none bg-transparent px-4 py-3 text-sm outline-none placeholder:text-[var(--color-text-muted)]"
    ></textarea>

    <div class="flex items-center justify-between px-3 pb-2">
      <button
        (click)="openFilePicker()"
        class="cursor-pointer rounded-md p-1.5 text-[var(--color-text-muted)] transition hover:bg-[var(--color-panel-hover)] hover:text-[var(--color-text)]"
        aria-label="Attach file"
      >
        <app-icon name="paperclip" [size]="18" />
      </button>
      <input
        #fileInputEl
        type="file"
        class="hidden"
        accept=".pdf,.txt,.md,.docx,.xlsx"
        (change)="onFileSelected($event)"
      />
      <button
        (click)="send()"
        [disabled]="!canSend()"
        class="flex cursor-pointer items-center justify-center rounded-lg bg-[var(--color-primary)] p-2 text-white transition hover:bg-[var(--color-primary-hover)] disabled:cursor-not-allowed disabled:opacity-40"
        aria-label="Send"
      >
        <app-icon name="send" [size]="16" />
      </button>
    </div>
  </div>
  <p class="mt-2 text-center text-xs text-[var(--color-text-muted)]">
    Answers come from your attached document only.
  </p>
</div>
