<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
  @for (toast of service.toasts(); track toast.id) {
    <div
      class="toast-animate flex gap-3 rounded-lg border p-4"
      [ngClass]="{
        'bg-[var(--color-panel)] border-[var(--color-border)]': true,
        'border-l-4 border-l-red-500': toast.type === 'error',
        'border-l-4 border-l-green-500': toast.type === 'success',
        'border-l-4 border-l-blue-500': toast.type === 'info'
      }"
    >
      <div class="flex-1">
        <p class="text-sm text-[var(--color-text)]">{{ toast.message }}</p>
      </div>
      <button
        (click)="service.dismiss(toast.id)"
        class="text-[var(--color-text-muted)] hover:text-[var(--color-text)] transition"
        aria-label="Dismiss toast"
      >
        <app-icon name="x" [size]="16" />
      </button>
    </div>
  }
</div>
